<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { max-width: 480px; margin: 40px auto; padding: 0 16px; font: 14px/1.5 system-ui, sans-serif;
         background: #10151d; color: #e6edf3; }
  h1 { font-size: 18px; color: #7ab8ff; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px;
          border: 1px solid #30363d; background: #161b22; color: #e6edf3; }
  .hint { color: #8b949e; font-size: 12px; margin-top: 3px; }
  button { margin-top: 18px; padding: 9px 22px; border: 0; border-radius: 8px;
           background: #1f6feb; color: #fff; font-weight: 600; cursor: pointer; }
  #saved { color: #3fb950; margin-left: 12px; visibility: hidden; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
</style>
</head>
<body>
  <h1>Настройки камеры</h1>
  <div class="row">
    <div>
      <label for="host">Хост (IP камеры)</label>
      <input id="host" placeholder="192.168.1.108">
    </div>
    <div>
      <label for="port">Порт</label>
      <input id="port" type="number" min="1" max="65535" placeholder="80">
    </div>
  </div>
  <label for="path">Путь</label>
  <input id="path" placeholder="/audio.cgi">
  <div class="hint">Тот же путь, что вы используете в Python-скрипте из ответа на StackOverflow</div>

  <label for="auth">Basic-аутентификация (необязательно)</label>
  <input id="auth" placeholder="user:password">
  <div class="hint">Логин:пароль камеры, если поток закрыт авторизацией. Иначе оставьте пустым.</div>

  <button id="save">Сохранить</button><span id="saved">Сохранено ✓</span>
  <script src="options.js"></script>
</body>
</html>
